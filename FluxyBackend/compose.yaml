         # MP_SMTP_AUTH_ACCEPT_ANY: 0
         # MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  fluxy-data:
  pgadmin-data:
  redis-data:

networks:
  postgres:
    driver: bridge
  redis:
    driver: bridge
